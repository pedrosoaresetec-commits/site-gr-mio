<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contato — Grêmio Desperta ETEC</title><meta name="description" content="Fale com o Grêmio Estudantil Desperta ETEC."><link rel="stylesheet" href="./css/style.css"><link rel="icon" type="image/png" href="./assets/logo.png"></head>
<body data-base="./"><div id="header"></div><main id="main" class="wrap sec"><h1>Contato</h1>
<p class="notice">Este site não possui servidor. Ao preencher, geramos uma mensagem para você enviar pelo seu e-mail. <strong>Nada é enviado automaticamente.</strong></p>
<form class="f" id="f" novalidate style="margin-top:1rem"><label>Nome<input name="name" required maxlength="80"></label><label>E-mail para resposta<input type="email" name="email" maxlength="120"></label><label>Assunto<input name="subject" required maxlength="100"></label><label>Mensagem<textarea name="msg" rows="5" required maxlength="1500"></textarea></label><input class="hp" name="site" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn">Gerar mensagem</button></form>
<div id="out" class="notice" hidden aria-live="polite"><p>Mensagem pronta. Ainda <strong>não foi enviada</strong>.</p><pre id="txt" style="white-space:pre-wrap"></pre><a class="btn" id="mail">Abrir meu e-mail</a> <button class="btn" id="copy" type="button">Copiar mensagem</button></div>
</main><div id="footer"></div><script src="./data/seed.js"></script><script src="./js/app.js"></script>
<script>document.addEventListener('gremio:ready',()=>{const G=Gremio,el=G.ui.el,$=i=>document.getElementById(i);

$('f').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(v.site)return;
 if(v.name.trim().length<2||v.subject.trim().length<3||v.msg.trim().length<10){G.ui.toast('Preencha nome, assunto e mensagem.');return}
 const t='Nome: '+v.name.trim()+'\nContato: '+(v.email||'não informado')+'\n\n'+v.msg.trim();$('txt').textContent=t;$('mail').href=G.mail(v,v.subject.trim(),t);$('out').hidden=false;e.target.reset()};
$('copy').onclick=()=>navigator.clipboard.writeText($('txt').textContent).then(()=>G.ui.toast('Mensagem copiada.'),()=>G.ui.toast('Não foi possível copiar.'));})</script></body></html>
