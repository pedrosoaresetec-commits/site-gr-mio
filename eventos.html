<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eventos — Grêmio Desperta ETEC</title><meta name="description" content="Eventos oficiais do Grêmio Estudantil Desperta ETEC.">
<link rel="stylesheet" href="./css/style.css"><link rel="icon" type="image/png" href="./assets/logo.png"></head>
<body data-base="./"><div id="header"></div>
<main id="main" class="wrap sec"><h1>Eventos</h1>
<div class="filters" id="filters" role="group" aria-label="Filtrar por categoria"></div>
<div id="list" class="grid"></div></main><div id="footer"></div>
<script src="./data/seed.js"></script><script src="./js/app.js"></script>
<script>document.addEventListener('gremio:ready',()=>{
const G=Gremio,all=G.events.all(),cats=['Todos',...new Set(all.map(e=>e.category).filter(Boolean))],f=document.getElementById('filters'),l=document.getElementById('list');
function show(c){G.events.render(l,c==='Todos'?all:all.filter(e=>e.category===c));f.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.textContent===c))}
cats.forEach(c=>{const b=G.ui.el('button',null,c);b.onclick=()=>show(c);f.append(b)});show('Todos')})</script>
</body></html>
